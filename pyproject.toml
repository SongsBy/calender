[dependency-groups]
dev = [
    "prek>=0.5.3,<1.0.0",
    "zizmor>=1.30.1",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "uv.lock",
    "frontend/pubspec.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/build/",
    "frontend/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
