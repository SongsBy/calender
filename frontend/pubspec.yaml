name: frontend
description: "Flutter frontend for the Full Stack FastAPI Template."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  go_router: ^17.5.0
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  flutter_web_plugins:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

